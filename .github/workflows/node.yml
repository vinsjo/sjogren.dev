name: 'run build'

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v5
      - name: 'set up Node'
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: 'npm ci'
      - run: 'npm run build -- --mode ci'
